[project]
name = "motionforge"
version = "0.1.0"
description = "Two Unitree G1 humanoids learn tag from scratch with PPO and a self-play league, on mjlab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.6",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "mediapy>=1.2.6",
    "mjlab>=1.6",
    "mujoco~=3.11",
    "pillow>=12.3.0",
    "protobuf<7",
    "wandb>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mofo"]

[tool.uv]
package = true
